name: Release Gates

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.19.0"
  APP_NAME: "Polarbear-Vocab"

jobs:
  # ------------------------------------------------------------
  # 1. Release Gate
  #
  # Tag is the single source of truth:
  #   v0.1.1 -> 0.1.1
  #
  # The version is injected into:
  #   package.json
  #   app-ui/package.json
  #   src-tauri/tauri.conf.json
  #   Cargo.toml [workspace.package]
  # ------------------------------------------------------------
  gate:
    name: Release Gate
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            echo "::error::Expected vMAJOR.MINOR.PATCH, for example v0.1.1"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG}"
          echo "Release version: ${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Sync release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/sync-release-version.mjs "${RELEASE_VERSION}"

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const expected = process.env.RELEASE_VERSION;

          const jsonFiles = [
            "package.json",
            "app-ui/package.json",
            "src-tauri/tauri.conf.json"
          ];

          for (const file of jsonFiles) {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            const actual = json.version;

            console.log(`${file}: ${actual}`);

            if (actual !== expected) {
              console.error(
                `::error::Version mismatch: ${file}=${actual}, expected=${expected}`
              );
              process.exit(1);
            }
          }
          NODE

          python3 <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["RELEASE_VERSION"]
          path = pathlib.Path("Cargo.toml")

          data = tomllib.loads(path.read_text(encoding="utf-8"))
          actual = data.get("workspace", {}).get("package", {}).get("version")

          print(f"Cargo.toml [workspace.package]: {actual}")

          if actual != expected:
              print(
                  f"::error::Version mismatch: "
                  f"Cargo.toml={actual}, expected={expected}"
              )
              sys.exit(1)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Frontend tests
        run: pnpm --filter @polarbear/vocab-ui run test

      - name: Frontend build
        run: pnpm run build

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Rust format gate
        run: cargo fmt --all -- --check

      - name: Rust clippy gate
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features


  visual:
    name: UI Visual Gate
    needs: gate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Storybook build
        run: pnpm --filter @polarbear/vocab-ui run storybook:build

      - name: Screenshot and accessibility gates
        run: pnpm run test:visual


  # ------------------------------------------------------------
  # 2. macOS
  # Universal binary: Apple Silicon + Intel
  # Output: unsigned DMG + APP zip
  # ------------------------------------------------------------
  build-macos:
    name: macOS Universal
    needs: [gate, visual]
    runs-on: macos-latest

    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Sync release version
        run: |
          node scripts/sync-release-version.mjs "${RELEASE_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build unsigned macOS Universal app
        run: |
          pnpm run tauri build \
            --target universal-apple-darwin \
            --bundles app,dmg \
            --no-sign

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          DMG_PATH="$(
            find target/universal-apple-darwin/release/bundle/dmg \
              -maxdepth 1 \
              -type f \
              -name '*.dmg' \
              -print \
              -quit
          )"

          APP_PATH="$(
            find target/universal-apple-darwin/release/bundle/macos \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "${DMG_PATH}" ]; then
            echo "::error::DMG was not generated."
            exit 1
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "::error::.app bundle was not generated."
            exit 1
          fi

          cp "${DMG_PATH}" \
            "dist/${APP_NAME}-${RELEASE_VERSION}-macOS-universal.dmg"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "${APP_PATH}" \
            "dist/${APP_NAME}-${RELEASE_VERSION}-macOS-universal.app.zip"

          shasum -a 256 \
            "dist/${APP_NAME}-${RELEASE_VERSION}-macOS-universal.dmg" \
            "dist/${APP_NAME}-${RELEASE_VERSION}-macOS-universal.app.zip" \
            > dist/SHA256-macOS.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256-macOS.txt


  # ------------------------------------------------------------
  # 3. GitHub Release
  # macOS artifacts are unsigned. iPhone IPA distribution requires
  # Apple signing credentials and is not part of this release workflow.
  # ------------------------------------------------------------
  release:
    name: GitHub Release
    needs:
      - gate
      - build-macos

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS
          path: dist

      - name: Show release artifacts
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${TAG}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Polarbear Vocab ${TAG}" \
            --generate-notes \
            --verify-tag
