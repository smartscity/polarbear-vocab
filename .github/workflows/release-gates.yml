name: Release Gates

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  APP_NAME: "Polarbear-Vocab"

jobs:
  # ------------------------------------------------------------
  # 1. Release gate
  #    v0.1.0 -> project version must be 0.1.0
  # ------------------------------------------------------------
  gate:
    name: Release Gate
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            echo "::error::Expected vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate package.json and tauri.conf.json versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const expected = process.env.RELEASE_VERSION;
          const files = [
            "package.json",
            "src-tauri/tauri.conf.json"
          ];

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`::error::Missing ${file}`);
              process.exit(1);
            }

            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            const actual = json.version;

            console.log(`${file}: ${actual}`);

            if (actual !== expected) {
              console.error(
                `::error::Version mismatch: ${file}=${actual}, tag=${expected}`
              );
              process.exit(1);
            }
          }
          NODE

      - name: Validate Cargo.toml version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          path = pathlib.Path("src-tauri/Cargo.toml")

          if not path.exists():
              print("::error::Missing src-tauri/Cargo.toml")
              sys.exit(1)

          data = tomllib.loads(path.read_text(encoding="utf-8"))
          actual = data.get("package", {}).get("version")
          expected = os.environ["RELEASE_VERSION"]

          # Workspace-inherited version is allowed.
          if isinstance(actual, str):
              print(f"src-tauri/Cargo.toml: {actual}")

              if actual != expected:
                  print(
                      f"::error::Version mismatch: "
                      f"Cargo.toml={actual}, tag={expected}"
                  )
                  sys.exit(1)
          else:
              print("Cargo package version inherited from workspace; skipped.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint --if-present

      - name: Frontend tests
        run: npm run test --if-present

      - name: Frontend build
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust format gate
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy gate
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features


  # ------------------------------------------------------------
  # 2. macOS
  #    Universal binary: Apple Silicon + Intel
  #    Output: DMG + APP zip
  # ------------------------------------------------------------
  build-macos:
    name: macOS Universal
    needs: gate
    runs-on: macos-latest

    env:
      # Developer ID Application certificate, base64 encoded .p12
      APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # Optional. Tauri can normally infer this from APPLE_CERTIFICATE.
      APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}

      # Used for Apple notarization.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        working-directory: app-ui
        run: npm ci

      - name: Build signed + notarized macOS Universal app
        run: |
          npm run tauri build -- \
            --target universal-apple-darwin \
            --bundles app,dmg

      - name: Collect macOS artifacts
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          DMG_PATH="$(
            find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
              -maxdepth 1 -type f -name '*.dmg' -print -quit
          )"

          APP_PATH="$(
            find src-tauri/target/universal-apple-darwin/release/bundle/macos \
              -maxdepth 1 -type d -name '*.app' -print -quit
          )"

          test -n "${DMG_PATH}"
          test -n "${APP_PATH}"

          cp "${DMG_PATH}" \
            "dist/${APP_NAME}-${VERSION}-macOS-universal.dmg"

          ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            "${APP_PATH}" \
            "dist/${APP_NAME}-${VERSION}-macOS-universal.app.zip"

          shasum -a 256 dist/* > dist/SHA256-macOS.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256-macOS.txt


  # ------------------------------------------------------------
  # 3. iPhone / iOS
  #
  # Current mode: ad-hoc
  # - Good for your own registered iPhone devices.
  # - IOS_MOBILE_PROVISION must be an Ad Hoc provisioning profile.
  #
  # Later for App Store / TestFlight:
  # change:
  #   --export-method ad-hoc
  # to:
  #   --export-method app-store-connect
  # and use an App Store Connect provisioning profile.
  # ------------------------------------------------------------
  build-ios:
    name: iPhone IPA
    needs: gate
    runs-on: macos-latest

    env:
      # Apple Distribution certificate exported as base64 .p12.
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      # Base64 encoded .mobileprovision.
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}

      # Apple Developer Team ID.
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Ensure CocoaPods is available
        shell: bash
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Initialize iOS project if missing
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npm run tauri ios init -- --ci
          fi

      - name: Build signed iPhone IPA
        run: |
          npm run tauri ios build -- \
            --ci \
            --export-method ad-hoc

      - name: Collect iPhone artifact
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          IPA_PATH="$(
            find src-tauri/gen/apple/build \
              -type f -name '*.ipa' \
              -print -quit
          )"

          if [ -z "${IPA_PATH}" ]; then
            echo "::error::IPA was not generated."
            find src-tauri/gen/apple -maxdepth 5 -type f || true
            exit 1
          fi

          cp "${IPA_PATH}" \
            "dist/${APP_NAME}-${VERSION}-iPhone.ipa"

          shasum -a 256 dist/*.ipa > dist/SHA256-iPhone.txt

      - name: Upload iPhone artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhone
          if-no-files-found: error
          path: |
            dist/*.ipa
            dist/SHA256-iPhone.txt


  # ------------------------------------------------------------
  # 4. GitHub Release
  #
  # Only created after BOTH macOS and iPhone succeed.
  # ------------------------------------------------------------
  release:
    name: GitHub Release
    needs:
      - gate
      - build-macos
      - build-ios

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS
          path: dist

      - name: Download iPhone artifacts
        uses: actions/download-artifact@v4
        with:
          name: iPhone
          path: dist

      - name: Show release artifacts
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${TAG}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Polarbear Vocab ${TAG}" \
            --generate-notes \
            --verify-tag
