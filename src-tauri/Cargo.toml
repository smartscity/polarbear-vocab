[package]
name = "polarbear-vocab-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "polarbear_vocab_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
polarbear-vocab-application = { path = "../crates/application" }
polarbear-vocab-dataset-import = { path = "../crates/dataset-import" }
polarbear-vocab-domain = { path = "../crates/domain" }
polarbear-vocab-speech = { path = "../crates/speech" }
polarbear-vocab-storage-sqlite = { path = "../crates/storage-sqlite" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
