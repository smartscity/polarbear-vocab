[package]
name = "polarbear-vocab-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
polarbear-vocab-application = { path = "../application" }
polarbear-vocab-domain = { path = "../domain" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", features = ["AVAudioSession", "AVAudioSessionTypes", "AVSpeechSynthesis"] }
objc2-foundation = "0.3"
