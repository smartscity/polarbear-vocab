[workspace]
members = [
  "crates/application",
  "crates/collection-engine",
  "crates/dataset-import",
  "crates/domain",
  "crates/lexicon",
  "crates/quiz-engine",
  "crates/speech",
  "crates/statistics-engine",
  "crates/storage-sqlite",
  "src-tauri",
  "tools/lexicon-builder",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
